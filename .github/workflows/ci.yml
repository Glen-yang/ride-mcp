name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ride_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: ride_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ride_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          RIDE_AGENT_TEST_DATABASE_URL: postgresql://ride_test:isolated_ci_only@127.0.0.1:5432/ride_test
      - run: npm run verify:package
