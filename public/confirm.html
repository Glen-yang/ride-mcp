<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirm in Ride</title><style>/*INLINE_CSS*/:root {
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #171717;
  background: #f4f4f0;
  font-size: 14px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
}
main {
  max-width: 900px;
  margin: auto;
}
.brand {
  font-size: 24px;
  font-weight: 850;
  letter-spacing: -1px;
}
.brand span {
  background: #ffe500;
  padding: 2px 8px;
  border-radius: 6px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 22px;
}
h1 {
  font-size: 25px;
  letter-spacing: -0.7px;
  margin: 8px 0 6px;
}
h2 {
  font-size: 16px;
  margin: 0 0 12px;
}
.muted {
  color: #666;
  line-height: 1.6;
}
.card {
  background: white;
  border: 1px solid #e2e2da;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 12px;
}
.grid {
  margin-bottom: 12px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.grid .card {
  margin: 0;
}
.row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 0;
  border-bottom: 1px solid #f0f0eb;
}
.row:last-child {
  border: 0;
}
.row strong {
  text-align: right;
}
.metric {
  font-size: 24px;
  font-weight: 750;
}
.tag {
  border-radius: 99px;
  background: #f1f1e9;
  padding: 5px 9px;
  font-size: 12px;
}
.warning {
  border-left: 3px solid #f6d600;
  background: #fffce2;
  padding: 12px;
  line-height: 1.6;
  border-radius: 8px;
  margin: 14px 0;
}
button,
.button {
  background: #ffe500;
  color: #111;
  border: 0;
  border-radius: 10px;
  padding: 13px 18px;
  font-weight: 750;
  cursor: pointer;
  display: inline-block;
  text-decoration: none;
}
button.secondary {
  background: #eee;
}
button:disabled {
  opacity: 0.5;
  cursor: wait;
}
.actions {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 16px;
}
.error {
  color: #a32626;
}
.good {
  color: #147a4b;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th,
td {
  padding: 10px 6px;
  text-align: left;
  border-bottom: 1px solid #eee;
}
.table-wrap {
  overflow-x: auto;
}
input,
select {
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font: inherit;
  width: 100%;
  margin: 6px 0 14px;
}
details {
  margin-top: 14px;
}
pre {
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 12px;
}
footer {
  margin: 18px 0;
  font-size: 12px;
  color: #666;
}
.status {
  font-size: 12px;
  letter-spacing: 0.2px;
  text-transform: uppercase;
}
@media (max-width: 520px) {
  body {
    padding: 14px;
  }
  .grid {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 22px;
  }
  .card {
    padding: 15px;
  }
  .row {
    gap: 8px;
  }
  .metric {
    font-size: 21px;
  }
}
[hidden] { display: none !important; }
</style></head><body><main><header><div class="brand"><span>ride</span> / confirmation</div><span class="tag">Human approval</span></header><div id="login" class="card"><h1>Sign in to review your proposal</h1><p class="muted">Ride verifies your account before displaying or confirming changes.</p><label>Access code, if required<input id="access-code" autocomplete="off"></label><button id="sign-in">Continue with Google</button></div><div id="status" aria-live="polite"></div><div id="content"></div><div id="actions" class="actions" hidden><button id="approve">Confirm these parameters</button><button id="reject" class="secondary">Reject proposal</button></div></main><script type="module">/*INLINE_VIEW*/const el = (tag, text, cls) => {
  const node = document.createElement(tag);
  if (text !== undefined && text !== null) node.textContent = String(text);
  if (cls) node.className = cls;
  return node;
};
const val = (v) => (v === null || v === undefined ? "Unavailable" : String(v));
const row = (label, value) => {
  const r = el("div", null, "row");
  r.append(el("span", label, "muted"), el("strong", val(value)));
  return r;
};
const card = (title) => {
  const c = el("section", null, "card");
  c.append(el("h2", title));
  return c;
};
const usdc = (v) => (v == null ? "Unavailable" : `${v} USDC`);
function sleeveCards(sleeves) {
  const grid = el("div", null, "grid");
  for (const s of sleeves) {
    const c = card(s.trader?.handle ?? s.copy_id);
    c.append(
      el("span", `${s.trader?.market ?? ""} · ${s.trader?.style ?? ""}`, "tag"),
      row("Copy Score", s.trader?.score),
      row("Allocation", usdc(s.amount_usdc)),
      row("Leverage cap", `${s.leverage_cap}x`),
      row("Sleeve loss trigger", `${s.stop_loss_pct}%`),
    );
    if (s.state)
      c.append(
        row("State", s.state),
        row("Net contribution", usdc(s.net_profit_usdc)),
      );
    grid.append(c);
  }
  return grid;
}
function render(root, value, openLink = () => {}, callTool = () => {}) {
  root.replaceChildren();
  if (!value) {
    root.append(
      card("Connect Ride to load your portfolio"),
      el(
        "p",
        "Preferences → recommendations → review → confirm in Ride",
        "muted",
      ),
    );
    return;
  }
  root.append(el("div", value.status, "status"));
  if (value.error) {
    root.append(el("p", value.error.message, "warning error"));
    return;
  }
  const d = value.data ?? {};
  if (d.plan) {
    const plan = d.plan;
    root.append(
      el("h1", "Your trader basket"),
      el(
        "p",
        `${usdc(plan.preferences.budget_usdc)} · ${plan.preferences.market} · ${plan.allocations.length} traders`,
        "muted",
      ),
      sleeveCards(plan.allocations),
    );
    const risk = card("Portfolio parameters");
    risk.append(
      row("Loss trigger", `${plan.preferences.loss_trigger_pct}%`),
      row(
        "Historical portfolio drawdown",
        d.portfolio_historical_drawdown_pct == null
          ? "Unavailable"
          : `${d.portfolio_historical_drawdown_pct}%`,
      ),
      row("Existing entry deviation", "≤ 0.2%"),
      row("Plan expires", new Date(plan.expires_at).toLocaleString()),
    );
    root.append(risk);
    const start = el("button", "Review start proposal");
    start.addEventListener("click", () =>
      callTool("start_copy", { plan_id: plan.id }),
    );
    root.append(start);
  }
  if (d.portfolio) {
    const p = d.portfolio;
    root.append(
      el("h1", "Your portfolio"),
      el("p", `${p.state} · ${p.id}`, "muted"),
    );
    const overview = card("Actual account");
    overview.append(
      row("Account value", usdc(p.account_value_usdc)),
      row("Reconciled net profit", usdc(p.net_profit_usdc)),
      row("Available funds", usdc(p.available_usdc)),
      row("Pending reserve", usdc(p.reserved_usdc)),
      row("Allocated funds", usdc(p.allocated_usdc)),
      row("Accounting", p.reconciliation),
    );
    root.append(overview, sleeveCards(p.sleeves));
    for (const s of p.sleeves.filter((s) => s.state === "active")) {
      const stop = el("button", `Wind down ${s.trader.handle}`, "secondary");
      stop.addEventListener("click", () =>
        callTool("stop_copy", { copy_id: s.copy_id, mode: "wind_down" }),
      );
      root.append(stop);
    }
    const positions = card("Owned positions · gross and net");
    for (const a of p.positions ?? [])
      positions.append(
        row(
          `${a.asset} · ${a.market}`,
          `Gross ${usdc(a.gross_notional_usdc)} / Net ${usdc(a.net_notional_usdc)}`,
        ),
      );
    root.append(positions);
    if (p.executions?.length) {
      const executions = card("Execution status");
      for (const e of p.executions) executions.append(row(e.key, e.status));
      root.append(executions);
    }
  }
  if (d.trader) {
    const t = d.trader;
    root.append(
      el("h1", t.handle),
      el("p", `${t.market} · ${t.style} · ${t.direction}`, "muted"),
    );
    const profile = card(`Copy Score ${t.score}`);
    profile.append(row("Scoring version", t.score_version));
    for (const [key, value] of Object.entries(t.components ?? {}))
      profile.append(row(key, value));
    profile.append(
      row(
        "Source ROI",
        t.source_roi_pct == null ? "Unavailable" : `${t.source_roi_pct}%`,
      ),
      row(
        "Source drawdown",
        t.source_drawdown_pct == null
          ? "Unavailable"
          : `${t.source_drawdown_pct}%`,
      ),
    );
    root.append(
      profile,
      el(
        "p",
        "Source performance describes the trader, not your follower account.",
        "muted",
      ),
    );
  }
  if (d.proposal) {
    const q = d.proposal;
    root.append(
      el("h1", "Review before confirming"),
      el("p", `${q.action} · ${q.status}`, "muted"),
    );
    if (q.preview?.portfolio?.portfolio)
      renderNestedPortfolio(root, q.preview.portfolio.portfolio);
    const params = card("Frozen parameters");
    params.append(
      row("Loss trigger amount", usdc(q.preview?.loss_trigger_amount_usdc)),
      row("Existing entry deviation", "≤ 0.2%"),
      row(
        "Fee estimate",
        q.preview?.fees?.estimate_usdc == null
          ? "Unavailable · exact fee at settlement"
          : usdc(q.preview.fees.estimate_usdc),
      ),
      row("Expires", new Date(q.expires_at).toLocaleString()),
      row(
        "Execution state",
        q.status === "requires_confirmation"
          ? "Not submitted"
          : q.execution_tasks?.map((e) => e.status).join(", ") || q.status,
      ),
    );
    const details = el("details");
    details.append(
      el("summary", "View exact requested changes"),
      el("pre", JSON.stringify(q.arguments, null, 2)),
    );
    params.append(details);
    root.append(params);
    if (q.status === "requires_confirmation" && q.confirmation_url) {
      const b = el("button", "Open Ride confirmation");
      b.addEventListener("click", () => openLink(q.confirmation_url));
      root.append(b);
    }
  }
  if (d.observations) {
    root.append(el("h1", "Portfolio review"));
    for (const o of d.observations)
      root.append(
        el(
          "p",
          Object.entries(o)
            .map(([k, v]) => `${k}: ${val(v)}`)
            .join(" · "),
          "card",
        ),
      );
    if (!d.observations.length)
      root.append(
        el("p", "No actionable observations from current coverage.", "muted"),
      );
  }
  if (d.updates) {
    root.append(el("h1", "Ride updates"));
    for (const u of d.updates) {
      const c = card(u.kind);
      c.append(
        el("p", u.message),
        el("time", new Date(u.at).toLocaleString(), "muted"),
      );
      root.append(c);
    }
    if (!d.updates.length) root.append(el("p", "No new updates.", "muted"));
  }
  for (const warning of value.warnings ?? [])
    root.append(el("p", warning, "warning"));
  root.append(
    el(
      "footer",
      `Data as of ${value.as_of ?? "Unavailable"}. Configuration, submission, fill and settlement are separate states.`,
    ),
  );
}
function renderNestedPortfolio(root, p) {
  root.append(sleeveCards(p.sleeves ?? []));
}

const config=/*CONFIG*/{};let client,csrf,proposal;const status=document.getElementById('status'),content=document.getElementById('content');
const showError=e=>{status.textContent=e?.message??String(e);status.className='warning error';};
async function init(){if(client)return client;if(!config.privy_app_id)throw Error('Ride sign-in is unavailable.');const {default:Privy,LocalStorage}=await import(config.privy_sdk);client=new Privy({appId:config.privy_app_id,...(config.privy_client_id?{clientId:config.privy_client_id}:{}),storage:new LocalStorage()});await client.initialize();return client;}
async function call(operation,body){const response=await fetch(`/agent/human/${operation}`,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',...(csrf?{'X-Ride-CSRF':csrf}:{})},body:JSON.stringify(body)});const payload=await response.json();if(!response.ok)throw Error(payload.error?.message??'Ride request failed');return payload;}
async function finish(session){const c=await init();let user=session?.user??(await c.user.get()).user;const accounts=user?.linkedAccounts??user?.linked_accounts??[];const wallet=accounts.find(x=>x.type==='wallet'&&(x.chainType??x.chain_type)==='ethereum'&&(x.walletClientType??x.wallet_client_type)==='privy');if(!wallet)throw Error('Set up your Ride wallet in the App before confirming.');const login=await call('login',{privyId:user.id,privyAccessToken:await c.getAccessToken(),walletAddress:wallet.address,privyWalletId:wallet.id,authProvider:'GOOGLE',accessCode:sessionStorage.getItem('ride:agent:access-code')??undefined});csrf=login.csrf;sessionStorage.removeItem('ride:agent:access-code');document.getElementById('login').hidden=true;const value=await call('proposal',{proposal_id:config.proposal_id});proposal=value.data.proposal;render(content,value);content.querySelectorAll('button').forEach(b=>b.remove());document.getElementById('actions').hidden=proposal.status!=='requires_confirmation';status.textContent='';}
document.getElementById('sign-in').onclick=async()=>{try{const c=await init();sessionStorage.setItem('ride:mcp:oauth_authorize_url',location.href);sessionStorage.setItem('ride:agent:access-code',document.getElementById('access-code').value);const out=await c.auth.oauth.generateURL('google',`${location.origin}/auth/privy/oauth/callback`);location.assign(out.url);}catch(e){showError(e);}};
for(const [id,operation] of [['approve','confirm'],['reject','reject']])document.getElementById(id).onclick=async()=>{const actions=document.getElementById('actions');actions.querySelectorAll('button').forEach(b=>b.disabled=true);try{const value=await call(operation,{proposal_id:config.proposal_id,...(operation==='confirm'?{preview_hash:proposal.preview_hash}:{})});render(content,value);actions.hidden=true;status.textContent=operation==='confirm'?'Confirmed and queued. Fills and settlement are still pending.':'Proposal rejected.';}catch(e){showError(e);actions.querySelectorAll('button').forEach(b=>b.disabled=false);}};
const query=new URL(location.href).searchParams;if(query.get('privy_oauth_code')&&query.get('privy_oauth_state')){const c=await init();try{const s=await c.auth.oauth.loginWithCode(query.get('privy_oauth_code'),query.get('privy_oauth_state'),'google');history.replaceState({},'',location.pathname);await finish(s);}catch(e){showError(e);}}else if(query.has('error'))showError(Error('Ride login declined.'));
</script></body></html>
